[package]
name = "sdev"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Specifications-first development with people and AI"
license = "MIT"
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }

[dependencies]
github-slugger = "=0.1.0"
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde_json = "=1.0.145"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
