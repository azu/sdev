[package]
name = "sdev"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Specifications-first development with people and AI"
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
exclude = ["experiments/command-distribution/rust"]
resolver = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
