[package]
name = "sdev"
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
description = "Specifications-first development with people and AI"
license = "MIT"
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }

[dependencies]
github-slugger = "=0.1.0"
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
similar = "=2.7.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
unicode-segmentation = "=1.13.3"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
