[tools]
node = "24.20.0"
pnpm = "12.14.0"
"aqua:jdx/hk" = "2.7.0"

[settings]
# Rust is managed by rustup and rust-toolchain.toml, outside mise.lock.
idiomatic_version_file_enable_tools = []
disable_tools = ["rust"]

[hooks]
postinstall = "mise run setup"

[tasks.setup]
description = "Install documentation dependencies and register Git hooks"
run = ["pnpm install --frozen-lockfile", "hk install --mise"]

[tasks."md:lint"]
description = "Check English/Japanese prose, language pairs, and document links"
run = [
  "pnpm exec textlint --config .textlintrc.json README.md",
  "pnpm exec textlint --config .textlintrc.ja.json README.ja.md",
  "node scripts/check-doc-languages.mjs",
  "cargo run --locked --package sdev --bin sdev -- lint",
]

[tasks."md:fix"]
description = "Fix English and Japanese README prose"
run = [
  "pnpm exec textlint --config .textlintrc.json --fix README.md",
  "pnpm exec textlint --config .textlintrc.ja.json --fix README.ja.md",
]

[tasks."rs:check"]
description = "Run the existing Rust checks"
run = "cargo xtask check"

[tasks.pre-commit]
description = "Check staged document and Rust changes with hk"
run = "hk run pre-commit"

[tasks.check]
description = "Run Rust and document checks"
depends = ["rs:check", "md:lint"]
